# render.yaml — Render Blueprint for Aarogya Bandhu
# Dashboard: https://dashboard.render.com/blueprints → "New Blueprint Instance"
# Select this repo (POTATO-VE1/Arogya-Bandhu) and Render will create everything
# in this file: one free web service running the Docker image built from
# the Dockerfile at the repo root.
#
# Notes on the free tier:
# - Persistent disks are not supported on free services, so SQLite lives in
#   the container's ephemeral filesystem at /tmp/app.db. start.sh re-seeds
#   the demo dataset on every cold start, so judges always see fresh data.
# - SECRET_KEY and ADMIN_PASSWORD are auto-generated by Render. You can find
#   their values in the service's "Environment" tab after the first deploy.
# - PUBLIC_BASE_URL must be set manually after the first deploy, to the URL
#   Render assigns (e.g. https://aarogya-bandhu-xxxx.onrender.com). It is
#   used as the base for Twilio webhook callbacks.

services:
  - type: web
    name: aarogya-bandhu
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Render injects PORT (e.g. 10000) at runtime; the CMD honors ${PORT:-8000}.
    healthCheckPath: /api/healthz
    autoDeploy: true
    # NOTE: persistent disk is NOT allowed on Render Free tier (verified 2026-07
    # — see https://docs.render.com/disks). The SQLite database lives in the
    # container's ephemeral filesystem, so it is wiped on every redeploy.
    # start.sh runs `seed_demo --reset --with-demo-data` on every cold start,
    # so the demo always has 30 fresh patients. If you need persistence, upgrade
    # to a paid plan and uncomment the disk block below.
    #
    # disk:
    #   name: aarogya-bandhu-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      # SQLite in the container's ephemeral filesystem. start.sh re-seeds
      # demo data on every cold start, so this is fine for the demo.
      - key: DATABASE_URL
        value: sqlite:////tmp/app.db
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PRODUCTION
        value: "true"
      - key: SEED_DEMO
        value: "1"
      - key: HOSPITAL_CODE
        value: KA-DIST-01
      - key: HOSPITAL_NAME
        value: District Hospital Demo
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      # Required by app/config.py.validate_production():
      - key: SECRET_KEY
        generateValue: true   # Render generates a strong random value
      - key: ADMIN_PASSWORD
        generateValue: true   # Render generates a strong random value
      # Set this manually after the first deploy, to the assigned onrender.com URL
      - key: PUBLIC_BASE_URL
        sync: false
      # Optional — leave empty for sim-only mode:
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CALL_ALLOWLIST
        sync: false
