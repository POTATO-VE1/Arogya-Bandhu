services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - app-data:/app/backend/data
      - ./backend/data/audio:/app/backend/data/audio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app-data:
